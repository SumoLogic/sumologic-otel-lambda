name: PRs checks

on:
  pull_request:
    branches:
      - main
      - 'release-java-v[0-9]+.[0-9]+.[0-9]+'
      - 'release-nodejs-v[0-9]+.[0-9]+.[0-9]+'
      - 'release-python-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  docs-changed:
    runs-on: ubuntu-22.04
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if documentation related files changed
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            **/*.md
            ci/*
            .github/*
            **/Makefile
            .*

  markdownlint:
    runs-on: ubuntu-22.04
    needs: [docs-changed]
    if: needs.docs-changed.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: install markdownlint
        run: npm install -g markdownlint-cli
      - name: markdownlint check
        run: make markdown-lint

  yamllint:
    runs-on: ubuntu-22.04
    needs: [docs-changed]
    if: needs.docs-changed.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: install yamllint
        run: pip install yamllint
      - name: yamllint
        run: make yaml-lint

  markdown-link-check:
    runs-on: ubuntu-22.04
    needs: [docs-changed]
    if: needs.docs-changed.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.markdown_link_check.json'
          use-quiet-mode: yes
          check-modified-files-only: yes
          base-branch: ${{ github.base_ref }}

  md-links-lint:
    runs-on: ubuntu-22.04
    needs: [docs-changed]
    if: needs.docs-changed.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown links
        run: |
          make markdown-links-lint

  markdown-table-formatter-check:
    runs-on: ubuntu-22.04
    needs: [docs-changed]
    if: needs.docs-changed.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install markdown-table-formatter
        run: npm install markdown-table-formatter --save
      - name: Run markdown-table-formatter
        run: CMD=./node_modules/.bin/markdown-table-formatter make markdown-table-formatter-check

  terraform-lint:
    runs-on: ubuntu-22.04
    name: Check terraform files
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform fmt java
        uses: dflook/terraform-fmt@v1
        with:
          path: java/tests/deploy
      - name: Terraform fmt nodejs
        uses: dflook/terraform-fmt@v1
        with:
          path: nodejs/tests/deploy
      - name: Terraform fmt python
        uses: dflook/terraform-fmt@v1
        with:
          path: python/tests/deploy
      - name: Terraform fmt utils/api-gw
        uses: dflook/terraform-fmt@v1
        with:
          path: utils/api-gw/api-gateway-proxy
      - name: Terraform fmt utils/receiver-mock
        uses: dflook/terraform-fmt@v1
        with:
          path: utils/receiver-mock/deploy

  # Single required status check for this workflow. A job skipped by a job-level
  # `if` reports a `skipped` conclusion that branch protection accepts, so this
  # stays green when no relevant files changed but fails if any check failed.
  pr-checks-complete:
    runs-on: ubuntu-22.04
    needs:
      - docs-changed
      - markdownlint
      - yamllint
      - markdown-link-check
      - md-links-lint
      - markdown-table-formatter-check
      - terraform-lint
    if: always()
    steps:
      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one PR check failed or was cancelled."
          exit 1
